name: CPU implementation and report checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: kvcache predict --usable-vram-gib 14.5
      - run: kvcache prepare-prereg --output "${{ runner.temp }}/phase1-prediction-draft"
      - run: kvcache plan --experiment configs/experiment.json
      - run: kvcache validate-probe --request configs/probe.example.json
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-demo.txt
      - name: Validate saved schemas and presentation API
        run: python -m unittest discover -s tests -v
      - name: Execute the full CPU presentation and export HTML
        run: python scripts/execute_presentation.py --output "${{ runner.temp }}/kv-presentation"
      - uses: actions/upload-artifact@v4
        with:
          name: executed-project-presentation
          path: ${{ runner.temp }}/kv-presentation
