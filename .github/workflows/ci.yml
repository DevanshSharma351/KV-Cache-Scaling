name: CPU implementation and report checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src scripts
      - run: kvcache predict --usable-vram-gib 14.5
      - run: kvcache prepare-prereg --output "${{ runner.temp }}/phase1-prediction-draft"
      - run: kvcache plan --experiment configs/experiment.json
      - run: kvcache validate-probe --request configs/probe.example.json
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -r requirements-analysis.txt
      - name: Reproduce saved evidence without a GPU
        run: >-
          python scripts/reproduce_results.py
          --capsule artifacts/experiments/2026-10-19-t4-final/gpu-checkpoint-080.zip
          --output "${{ runner.temp }}/kv-reproduction"
      - uses: actions/upload-artifact@v4
        with:
          name: reproduced-evidence-report
          path: ${{ runner.temp }}/kv-reproduction
